<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CCC&amp;B admin | Sunny 88.7 FM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/directory/directory.css">
<style>
  .page{padding:28px 20px 72px}
  .login{max-width:400px;margin:60px auto}
  .tabs{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font:600 14px var(--body);cursor:pointer;color:var(--ink)}
  .tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .adm{grid-template-columns:72px 1fr}
  .adm .logo{width:72px;height:72px;font-size:24px}
  .private{background:#F3F6FA;border-radius:var(--r-s);padding:10px 12px;font-size:14px;margin:8px 0 12px}
  .kv{font-size:14px;color:#33445C;display:grid;grid-template-columns:120px 1fr;gap:3px 10px;margin:8px 0}
  .kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
  .btn-ok{background:var(--green);color:#fff} .btn-bad{background:#fff;color:var(--red);border:1px solid #F0C8C4}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .bar h1{font:700 28px var(--display);margin:0}
  #editForm .stack{display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/directory/"><span class="dot" aria-hidden="true"></span><span>CCC&amp;B<small>Listings admin</small></span></a>
    <button class="btn btn-ghost" id="logout" hidden>Log out</button>
  </div>
</header>

<div class="wrap page">
  <form class="form-card login" id="loginForm" hidden>
    <h1 style="font:700 26px var(--display);margin:0 0 18px">Log in</h1>
    <div class="formerr" id="loginErr" hidden style="background:#FDECEA;color:#8A1F17;border-radius:6px;padding:10px 12px;margin-bottom:14px"></div>
    <div class="field" style="margin-bottom:12px"><label for="em">Email</label><input class="input" id="em" type="email" required autocomplete="username"></div>
    <div class="field" style="margin-bottom:18px"><label for="pw">Password</label><input class="input" id="pw" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary" style="width:100%;padding:13px">Log in</button>
  </form>

  <section id="app" hidden>
    <div class="bar">
      <h1>Listings</h1>
      <input class="input" id="search" type="search" placeholder="Search by name" style="max-width:280px">
    </div>
    <div class="tabs" id="tabs">
      <button data-s="pending" aria-pressed="true">Pending <span id="nPending"></span></button>
      <button data-s="approved">Approved</button>
      <button data-s="rejected">Rejected</button>
    </div>
    <div class="list" id="list"></div>
    <div class="pager"><button class="btn btn-ghost" id="prev">Previous</button><span class="count" id="pageInfo"></span><button class="btn btn-ghost" id="next">Next</button></div>
  </section>
</div>

<dialog class="sheet" id="editSheet" aria-labelledby="editTitle">
  <form id="editForm" method="dialog">
    <div class="sheet-head"><h2 id="editTitle">Edit listing</h2><button class="x" type="button" data-close aria-label="Close">×</button></div>
    <div class="sheet-body"><div class="stack" id="editFields"></div>
      <div class="actions" style="margin-top:18px"><button class="btn btn-primary" id="saveEdit" type="submit">Save changes</button><button class="btn btn-ghost" type="button" data-close>Cancel</button></div>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="/directory/config.js"></script>
<script>
(() => {
const C = window.SUNNY_DIR, S = window.SD, esc = S.esc;
const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const st = { status: 'pending', page: 1, q: '' };
const SIZE = 25;
let rows = {};

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('loginForm').hidden = false; $('app').hidden = true; $('logout').hidden = true; return; }
  const { data: adm } = await sb.from('directory_admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
  if (!adm) { await sb.auth.signOut(); $('loginErr').textContent = 'This account isn’t a directory admin.'; $('loginErr').hidden = false; $('loginForm').hidden = false; return; }
  $('loginForm').hidden = true; $('app').hidden = false; $('logout').hidden = false;
  load();
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('loginErr').hidden = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error) { $('loginErr').textContent = 'Email or password is wrong.'; $('loginErr').hidden = false; return; }
  boot();
});
$('logout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function load() {
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === st.status));
  $('list').innerHTML = '<div class="loading">Loading…</div>';
  let q = sb.from('businesses').select('*', { count: 'exact' }).eq('status', st.status);
  const term = st.q.replace(/[%_,()\\]/g, ' ').trim();
  if (term) q = q.ilike('name', `%${term}%`);
  q = st.status === 'pending' ? q.order('created_at', { ascending: true }) : q.order('featured', { ascending: false }).order('name');
  const from = (st.page - 1) * SIZE;
  const { data, count, error } = await q.range(from, from + SIZE - 1);
  if (error) { $('list').innerHTML = `<div class="empty">Couldn’t load listings: ${esc(error.message)}</div>`; return; }
  const pc = await sb.from('businesses').select('id', { count: 'exact', head: true }).eq('status', 'pending');
  $('nPending').textContent = pc.count ? `(${pc.count})` : '';
  rows = Object.fromEntries(data.map(b => [b.id, b]));
  $('list').innerHTML = data.length ? data.map(card).join('') : `<div class="empty"><h3>Nothing here</h3><p>${st.status === 'pending' ? 'No listings are waiting for review.' : 'No listings in this tab.'}</p></div>`;
  const pages = Math.max(1, Math.ceil((count || 0) / SIZE));
  $('pageInfo').textContent = `${(count || 0).toLocaleString()} listings · page ${st.page} of ${pages}`;
  $('prev').disabled = st.page <= 1; $('next').disabled = st.page >= pages;
}

function card(b) {
  const logo = b.logo_url ? `<div class="logo"><img src="${esc(b.logo_url)}" alt=""></div>` : `<div class="logo" style="background:${S.tint(b.name)}">${esc(S.initials(b.name))}</div>`;
  const kv = [['Category', b.category], ['Location', [b.address, b.town, b.region].filter(Boolean).join(', ')], ['Phone', b.phone], ['WhatsApp', b.whatsapp], ['Email', b.email], ['Website', b.website], ['Hours', b.hours], ['Church', b.church]]
    .filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  const btns = [];
  if (b.status !== 'approved') btns.push(`<button class="btn btn-ok btn-sm" data-act="approve" data-id="${b.id}">Approve</button>`);
  if (b.status !== 'rejected') btns.push(`<button class="btn btn-bad btn-sm" data-act="reject" data-id="${b.id}">Reject</button>`);
  if (b.status === 'approved') btns.push(`<button class="btn btn-sun btn-sm" data-act="feature" data-id="${b.id}">${b.featured ? 'Remove featured' : 'Make featured'}</button>`);
  btns.push(`<button class="btn btn-ghost btn-sm" data-act="edit" data-id="${b.id}">Edit</button>`);
  if (b.status === 'approved') btns.push(`<a class="btn btn-ghost btn-sm" target="_blank" href="/directory/?b=${encodeURIComponent(b.slug)}">View live</a>`);
  btns.push(`<button class="btn btn-bad btn-sm" data-act="delete" data-id="${b.id}">Delete</button>`);
  return `<article class="row adm${b.featured ? ' featured' : ''}">${logo}<div>
    <h3>${esc(b.name)}${b.featured ? '<span class="tag-feat">Featured</span>' : ''}</h3>
    <div class="meta"><span>Submitted ${new Date(b.created_at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}</span></div>
    <p style="margin:0;white-space:pre-line;font-size:15px">${esc(b.description)}</p>
    <dl class="kv">${kv}</dl>
    <div class="private"><strong>Submitted by:</strong> ${esc(b.contact_name)} · <a href="tel:${esc(digits(b.contact_phone))}">${esc(b.contact_phone)}</a></div>
    <div class="actions">${btns.join('')}</div></div></article>`;
}
function digits(v) { return String(v || '').replace(/[^\d+]/g, ''); }

$('list').addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const b = rows[btn.dataset.id], act = btn.dataset.act;
  let patch;
  if (act === 'approve') patch = { status: 'approved', approved_at: new Date().toISOString() };
  if (act === 'reject') patch = { status: 'rejected', featured: false };
  if (act === 'feature') patch = { featured: !b.featured };
  if (act === 'edit') return openEdit(b);
  if (act === 'delete') {
    if (!confirm(`Delete “${b.name}” permanently?`)) return;
    btn.disabled = true;
    const { error } = await sb.from('businesses').delete().eq('id', b.id);
    if (error) { alert('Delete failed: ' + error.message); btn.disabled = false; return; }
    return load();
  }
  btn.disabled = true;
  const { error } = await sb.from('businesses').update(patch).eq('id', b.id);
  if (error) { alert('Update failed: ' + error.message); btn.disabled = false; return; }
  load();
});

/* edit */
const EDIT = [['name', 'Business name'], ['category', 'Category', C.CATEGORIES], ['region', 'Region', C.REGIONS], ['town', 'Town or area'], ['address', 'Address or landmark'],
  ['description', 'Description', 'textarea'], ['hours', 'Opening hours'], ['church', 'Church they fellowship with'], ['phone', 'Phone'], ['whatsapp', 'WhatsApp'], ['email', 'Email'], ['website', 'Website']];
let editing = null;
function openEdit(b) {
  editing = b;
  $('editFields').innerHTML = EDIT.map(([k, label, kind]) => {
    const val = esc(b[k] || '');
    const ctl = Array.isArray(kind) ? `<select class="input" name="${k}">${kind.map(o => `<option${o === b[k] ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`
      : kind === 'textarea' ? `<textarea class="input" name="${k}" rows="5" maxlength="1200">${val}</textarea>`
      : `<input class="input" name="${k}" value="${val}">`;
    return `<div class="field"><label>${label}</label>${ctl}</div>`;
  }).join('');
  $('editSheet').showModal();
}
$('editSheet').addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === e.currentTarget) $('editSheet').close(); });
$('editForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData($('editForm')), patch = {};
  EDIT.forEach(([k]) => { const v = String(fd.get(k) || '').trim(); patch[k] = v || null; });
  if (!patch.name || !patch.description) return alert('Name and description can’t be empty.');
  if (patch.website) patch.website = S.safeUrl(patch.website) || null;
  $('saveEdit').disabled = true;
  const { error } = await sb.from('businesses').update(patch).eq('id', editing.id);
  $('saveEdit').disabled = false;
  if (error) return alert('Save failed: ' + error.message);
  $('editSheet').close(); load();
});

$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.status = b.dataset.s; st.page = 1; load(); });
let t; $('search').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value; st.page = 1; load(); }, 300); });
$('prev').addEventListener('click', () => { st.page--; load(); });
$('next').addEventListener('click', () => { st.page++; load(); });
boot();
})();
</script>
</body>
</html>
