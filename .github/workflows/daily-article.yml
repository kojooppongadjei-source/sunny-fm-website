name: Daily SEO Article

on:
  schedule:
    # 07:00 GMT daily (adjust as needed — Ghana is GMT year-round)
    - cron: "0 7 * * *"
  workflow_dispatch: {} # lets you trigger manually from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-article.js

      - name: Commit and push
        run: |
          git config user.name "sunnygh-content-bot"
          git config user.email "sunnyfm@gmail.com"
          git add content/news content/lifestyle content/seo/keywords.csv
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto: daily SEO article"
          git push

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily SEO article failed — run #${context.runNumber}`,
              body: `The daily article generation workflow failed.\n\nRun log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThis usually means the AI response failed to parse after 3 retries, an API/billing issue, or a git push conflict. Check the log above for the exact error.`,
              labels: ["automation-failure"],
            });
